[tool.uv.workspace]
members = [
    "packages/tinsel-core",
    "packages/tinsel-gates",
    "packages/tinsel-api",
    "packages/tinsel-demo",
]

[tool.uv.sources]
tinsel-core = { workspace = true }
tinsel-gates = { workspace = true }
tinsel-api = { workspace = true }
tinsel-demo = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# Three naming rules are suppressed rather than fixed. Only the first is a
# published wire contract; the other two are internal and suppressed only to
# keep this cleanup from turning into a rename. Each is listed with its reason
# so a future `ruff --fix` does not quietly break a consumer. See
# RENAME_PLAN.md for how to retire all three.
[tool.ruff.lint.per-file-ignores]
# N815: the four secureDNA_* fields of Gate2Result are pydantic model fields,
# so the attribute name *is* the JSON key. Those keys are declared in the
# TypeScript client (apps/dashboard/lib/api.ts), read by the record page
# (apps/dashboard/app/sequences/[id]/page.tsx), and persisted inside the
# certificates.consequence_report JSONB column of every certified record.
# Renaming them would blank the SecureDNA panel with no error and orphan the
# keys in existing rows, so it needs a data migration and a client release,
# not a linter.
"packages/tinsel-core/tinsel/consequence.py" = ["N815"]
# N999/N802: the module and function are named after the SecureDNA screening
# service. Unlike the fields above these are internal only: the stored audit
# trail records the literal strings "SecureDNA DOPRF" and "doprf_30mer_mock"
# as values, never the Python identifiers, so renaming them touches no data
# and no client. Suppressed only because a rename belongs in its own commit.
"packages/tinsel-gates/tinsel_gates/adapters/gate2/secureDNA.py" = ["N999", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# FastAPI/SQLAlchemy ecosystem: decorators and scalar() calls are untyped
# in a way that triggers strict errors; relax only the noisy checks.
[[tool.mypy.overrides]]
module = ["sentinel_api.*"]
disallow_untyped_decorators = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = [
    "packages/tinsel-core/tests",
    "packages/tinsel-gates/tests",
    "packages/tinsel-api/tests",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "anyio>=4.13.0",
    "httpx>=0.28.1",
]
