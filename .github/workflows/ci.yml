name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests (tinsel-core + tinsel-gates + tinsel-api) ──────────────
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install workspace packages
        run: |
          # --locked installs exactly what uv.lock pins, and fails if the lock
          # has drifted from the pyproject files, so CI type checks and tests
          # against the versions the app actually runs on. `uv pip install`
          # stood here until 2026-11-27: it resolves fresh from the index and
          # never reads the lockfile, which put 43 of the 62 locked packages at
          # a version no developer had. One was sqlalchemy, at 2.1.9 against a
          # locked 2.0.49, where `Select` became variadic, which is how an
          # annotation that type checked locally turned main red in #52. That
          # resolution also moved on its own: 2.1.8 a fortnight earlier, with
          # nothing in the repository changed.
          #
          # --python 3.12 holds uv to the interpreter setup-python just
          # installed. requires-python is only >=3.12, so without it uv is
          # free to pick up something newer from a future runner image.
          #
          # bandit and mypy sit in the `dev` group of the root pyproject rather
          # than being named here, so they are pinned too. mypy was absent from
          # this install until 2026-11-12, so the type check step exited 127
          # ("command not found") on every run it had ever made. A step that
          # fails before it runs reports the same red as a step that found
          # something, which is how 49 type errors accumulated unseen.
          uv sync --locked --all-packages --all-extras --python 3.12
          # uv syncs into .venv rather than onto the system python, so put its
          # entries on PATH for the steps below instead of activating it in
          # each one.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check packages/

      - name: Security scan (bandit)
        run: |
          bandit -r \
            packages/tinsel-core/tinsel/ \
            packages/tinsel-gates/tinsel_gates/ \
            packages/tinsel-api/sentinel_api/ \
            -ll -q

      # Advisory, matching the existing npm audit step: a new CVE in a
      # transitive dependency should be visible without blocking an unrelated
      # change.
      - name: Audit Python dependencies
        run: uv pip install pip-audit && pip-audit --strict || true
        continue-on-error: true

      - name: Type check (mypy)
        run: |
          mypy packages/tinsel-core/tinsel/ packages/tinsel-gates/tinsel_gates/
          mypy packages/tinsel-api/sentinel_api/

      - name: Test
        run: |
          pytest \
            packages/tinsel-core/tests/ \
            packages/tinsel-gates/tests/ \
            packages/tinsel-api/tests/ \
            -v --import-mode=importlib --cov=tinsel --cov=tinsel_gates --cov-report=xml
        env:
          SENTINEL_ENV: test

  # ── Migrations against real PostgreSQL ──────────────────────────────────
  # The test suite runs on SQLite with a JSONB compatibility patch, so it
  # cannot exercise JSONB, the append-only trigger from 003, server defaults,
  # or SELECT ... FOR UPDATE. Migrations are unverified until they run against
  # the real engine, and there is no local PostgreSQL on the development
  # machine, so this job is the only thing that checks them.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artgene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artgene_test
      SENTINEL_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install workspace packages
        run: |
          # Identical to the step in test-python, which carries the reasoning:
          # the lockfile is what alembic should run against, and one install
          # path means the two jobs cannot drift from each other either.
          uv sync --locked --all-packages --all-extras --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Generated rather than written here: SENTINEL_ENV=production refuses to
      # start on the development default key, and a 64-character hex literal in
      # a workflow file is the kind of thing that trains people to ignore
      # secret-scanner warnings.
      - name: Upgrade an empty database to head
        working-directory: packages/tinsel-api
        run: |
          export SPREADING_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          alembic upgrade head

      - name: Round-trip the latest migrations
        working-directory: packages/tinsel-api
        run: |
          export SPREADING_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          alembic downgrade 007
          alembic upgrade head

  # ── Client credential exposure guard ────────────────────────────────────
  # Catches the class of mistake a generic secret scanner misses: a credential
  # read on the client, which Next inlines into the bundle at build time, and a
  # server-side proxy that lends its key to anonymous callers. Stdlib only, so
  # it needs no install step.
  client-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No credential can reach the browser
        run: python3 scripts/check_no_client_secrets.py

  # ── Dashboard: type-check + build ───────────────────────────────────────
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npm run type-check

      # Run again here, where the build environment is the one Next will read,
      # so a secret-shaped NEXT_PUBLIC_* variable fails the build rather than
      # being compiled into the bundle.
      - name: No credential in the build environment
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_no_client_secrets.py

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
